[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cmc-api"
version = "0.1.0"
description = "Cardmarket Companion - backend API"
requires-python = ">=3.12"
dependencies = [
  "cmc-shared",
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "argon2-cffi>=25.1",
  "pywebpush>=2.5,<3",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "httpx>=0.28",
  "ruff>=0.16",
  "mypy>=2.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:pywebpush.*", "ignore:Using `httpx` with"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]
"app/scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = "../../packages/shared"
exclude = ["migrations/", "tests/"]
