[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cmc-shared"
version = "0.1.0"
description = "Shared contracts (enums, normalized models, agent protocol) for Cardmarket Companion"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[tool.setuptools.packages.find]
include = ["cmc_shared*"]

[tool.setuptools.package-data]
cmc_shared = ["py.typed"]
